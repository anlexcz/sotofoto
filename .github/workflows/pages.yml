name: Build and publish Šotofoto
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: pip install numpy==2.3.5 rasterio==1.5.2
      - run: python scripts/build_data.py
      - run: node --expose-gc --max-old-space-size=6144 scripts/regression.mjs
      - uses: actions/cache@v4
        with:
          path: .cache/terrain-v1.json
          key: terrain-v1-${{ github.run_id }}
          restore-keys: terrain-v1-
      - run: python scripts/build_terrain.py
      - run: python scripts/finalize_data.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
