name: Build and publish Šotofoto
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 4 * * *'
      timezone: Europe/Prague
    - cron: '7 5,6 * * *'
      timezone: Europe/Prague
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  recovery-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: check
        run: python scripts/gtfs_check.py
  build:
    needs: recovery-check
    if: always() && (needs.recovery-check.result == 'skipped' || needs.recovery-check.outputs.needed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare current and preceding GTFS service day
        id: gtfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/gtfs_update.py
      - run: python scripts/build_data.py --input '${{ steps.gtfs.outputs.input }}' --provenance gtfs-update/provenance.json
      - run: node --expose-gc --max-old-space-size=6144 scripts/regression.mjs
      - name: Compare recovered midnight passages with October 6 production
        run: |
          if [ -d gtfs-update/compiled-previous ]; then
            node --expose-gc --max-old-space-size=6144 scripts/regression_previous.mjs
          fi
      - name: Install pinned geographical terrain (no DEM)
        run: python scripts/terrain_dataset.py install
      - run: python scripts/finalize_data.py
      - name: Preserve verified compiled bootstrap (October 6 only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f gtfs-update/compiled-previous.zip ]; then
            BOOTSTRAP_TAG=$(python -c "import json; print(json.load(open('config/gtfs-bootstrap.json'))['tag'])")
            if ! gh release view "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$BOOTSTRAP_TAG" gtfs-update/compiled-previous.zip config/gtfs-bootstrap.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Compiled PID continuity bootstrap 2026-10-06" --notes "Verified compiled Pages data from October 6; not the original GTFS ZIP. One-time preservation of midnight passages. ROPID/PID CC BY." --latest=false
            fi
          fi
      - name: Preserve verified raw GTFS snapshot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ steps.gtfs.outputs.tag }}
        run: |
          if gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p gtfs-verify
            gh release download "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --pattern PID_GTFS.zip --dir gtfs-verify
            cmp gtfs-update/PID_GTFS.zip gtfs-verify/PID_GTFS.zip
          else
            gh release create "$SNAPSHOT_TAG" gtfs-update/PID_GTFS.zip gtfs-update/snapshot.json gtfs-update/PID_GTFS.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PID GTFS snapshot $SNAPSHOT_TAG" --notes "Verified original PID GTFS input for preceding service-day continuity. ROPID/PID, CC BY; see https://pid.cz/o-systemu/opendata/." --latest=false
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
